name: Low-frequency live contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * 0"

permissions:
  contents: read

concurrency:
  group: live-contracts
  cancel-in-progress: false

jobs:
  live-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the fixture-independent official contract smoke suite once weekly
        run: npm run test:live
