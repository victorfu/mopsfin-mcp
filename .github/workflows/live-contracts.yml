name: Low-frequency live contracts

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live contract suite to run
        required: true
        default: corporate-actions
        type: choice
        options:
          - corporate-actions
          - catalysts
          - all
  schedule:
    - cron: "23 20 * * 0"

permissions:
  contents: read

concurrency:
  group: live-contracts
  cancel-in-progress: false

jobs:
  live-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the focused corporate-action contracts
        if: github.event_name == 'schedule' || inputs.suite == 'corporate-actions'
        run: npm run test:live:corporate-actions
      - name: Run the focused catalyst event and snapshot contracts
        if: github.event_name == 'schedule' || inputs.suite == 'catalysts'
        run: npm run test:live:catalysts
      - name: Run all live contracts
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'all'
        run: npm run test:live
